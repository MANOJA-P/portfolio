<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-label="Placeholder portrait">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a2b"/>
      <stop offset="1" stop-color="#0b101c"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="420" height="420" rx="22"/></clipPath>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".5"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#round)">
    <rect width="420" height="420" fill="url(#bg)"/>
    <rect width="420" height="420" fill="url(#grid)" opacity=".5"/>
    <rect width="420" height="420" fill="url(#glow)"/>

    <!-- shoulders -->
    <path d="M210 250c68 0 124 40 140 96v74H70v-74c16-56 72-96 140-96Z" fill="url(#g)" opacity=".92"/>
    <!-- head -->
    <circle cx="210" cy="162" r="70" fill="#e8ecf4"/>
    <!-- hair -->
    <path d="M140 156a70 70 0 0 1 140 0c0-46-28-72-70-72s-70 26-70 72Z" fill="#0f172a"/>
    <!-- collar -->
    <path d="M170 268l40 40 40-40 22 12-62 62-62-62 22-12Z" fill="#0b101c" opacity=".55"/>
  </g>

  <rect x="0.5" y="0.5" width="419" height="419" rx="22" fill="none" stroke="#1f2937"/>
</svg>
